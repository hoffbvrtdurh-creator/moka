<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MY LOVE 💘</title>

  <!-- استدعاء الخطوط بشكل سريع ومحسّن -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Playfair+Display:wght=500;600;700&family=Poppins:wght=300;400;500&display=swap" rel="stylesheet">

  <!-- تحميل مكتبة الكونفيتي في الخلفية دون تعطيل الصفحة -->
  <script src="https://jsdelivr.net" defer></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1);
      background-size: 400% 400%;
      animation: bgMove 12s ease infinite;
      font-family: "Poppins", sans-serif;
      overflow: hidden;
      position: relative;
    }

    @keyframes bgMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .page {
      display: none;
      width: 100%;
      height: 100vh;
      align-items: center;
      justify-content: center;
      position: absolute;
      inset: 0;
    }

    .active {
      display: flex;
    }

    .card {
      width: min(92%, 420px); /* تقليل عرض الكارت قليلاً ليصبح ملموماً */
      padding: 30px 25px 35px; /* تقليص المسافات لرفع الزرار للأعلى */
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(18px);
      border-radius: 28px;
      text-align: center;
      box-shadow:
        0 30px 80px rgba(0,0,0,0.25),
        inset 0 0 0 1px rgba(255,255,255,0.4);
      position: relative;
      z-index: 10;
      animation: cardIn 0.6s ease-out;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 30px;
      background: linear-gradient(120deg, #ff4d6d, #ff9a9e, #fbc2eb);
      z-index: -1;
      filter: blur(20px);
      opacity: .7;
    }

    .emoji {
      font-size: 68px;
      margin-bottom: 12px;
      animation: heartbeat 1.8s infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.06); }
      50% { transform: scale(1); }
      75% { transform: scale(1.08); }
    }

    h2 {
      font-family: "Playfair Display", serif;
      font-size: 28px;
      color: #4a1c2f;
      margin-bottom: 15px;
      line-height: 1.4;
    }

    p {
      font-size: 20px;
      line-height: 1.7;
      color: #4a1c2f;
      font-weight: 500;
    }

    .buttons {
      position: relative;
      height: 78px;
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    button, .back-btn {
      padding: 14px 32px;
      border-radius: 40px;
      border: none;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all .2s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    button:active, .back-btn:active {
      transform: scale(0.95);
    }

    #yes {
      background: linear-gradient(135deg, #ff4d6d, #ff758f);
      color: #fff;
      box-shadow: 0 15px 35px rgba(255,77,109,0.55);
    }

    #yes:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(255,77,109,0.6);
    }

    #no {
      background: rgba(255, 255, 255, 0.9);
      color: #777;
    }

    #no:hover {
      transform: translateY(-2px);
    }

    .hint {
      margin-top: 25px;
      font-size: 13px;
      color: #6b6b6b;
      font-style: italic;
    }

    .heart {
      position: absolute;
      bottom: -20px;
      animation: floatUp linear forwards;
      pointer-events: none;
      z-index: 2;
    }

    @keyframes floatUp {
      from { transform: translateY(0) scale(1); opacity: 1; }
      to { transform: translateY(-120vh) scale(1.6); opacity: 0; }
    }

    .bg-text {
      position: absolute;
      top: -100px;
      color: rgba(255, 51, 102, 0.35);
      font-weight: bold;
      white-space: nowrap;
      user-select: none;
      pointer-events: none;
      animation: fallDown linear forwards;
      z-index: 1;
    }

    @keyframes fallDown {
      0% { transform: translateY(0) scale(.9); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(120vh) scale(1.1); opacity: 0; }
    }

    /* تحجيم وضبط الصورة لتناسب الكارت الملموم في الموبايل */
    .moka-img {
      width: 100%;
      max-width: 220px; /* تصغير الحد الأقصى لتوفير مساحة عمودية للزرار */
      height: auto;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      margin-bottom: 15px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .back-btn {
      background: linear-gradient(135deg, #ff4d6d, #ff758f);
      color: white;
      margin-top: 10px; /* تقليص المسافة العلوية لرفع الزرار */
      display: inline-block;
    }

    @media (max-width: 480px) {
      h2 { font-size: 23px; }
      .emoji { font-size: 58px; }
      button { padding: 12px 28px; font-size: 15px; }
      .moka-img { max-width: 200px; } /* حجم مثالي جداً لشاشات الموبايل الصغيرة */
    }
  </style>
</head>

<body>

  <!-- 1. الصفحة الأساسية للسؤال -->
  <div class="page active" id="homePage">
    <div class="card">
      <div class="emoji">🐣❤️</div>
      <h2>Moka,<br>Do You Love Me?</h2>
      <div class="buttons">
        <button id="yes">Yes 💖</button>
        <button id="no">No 🙈</button>
      </div>
      <div class="hint">Some love stories don’t allow “no” ✨</div>
    </div>
  </div>

  <!-- 2. صفحة YES المبهجة مع الرسالة الفرانكو ومطر اللغات -->
  <div class="page" id="yesPage">
    <div class="card">
      <div class="emoji" style="animation: none;">💖</div>
      <h2>Love You Much Better 💖</h2>
      <p>
        Ana Bas 3ayez Akol lk b7bk aktr bkter Rabna ya5leky leya
      </p>
    </div>
  </div>

  <!-- 3. صفحة NO المظبوطة بالمسافات الجديدة والملمومة -->
  <div class="page" id="noPage">
    <div class="card">
      <img src="https://i.postimg.cc/FHyfkQ12/Whats-App-Image-2026-05-16-at-9-46-08-PM.png" alt="Moka" class="moka-img">
      <h2 style="color: #ff3366; margin-bottom: 5px; font-size: 26px;">مفيش نو</h2>
      <button class="back-btn" onclick="backToQuestion()">ارجعي قولي Yes بقا 💖</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const homePage = document.getElementById("homePage");
    const yesPage = document.getElementById("yesPage");
    const noPage = document.getElementById("noPage");

    let textInterval; 
    let heartInterval; 

    // عند الضغط على YES
    yesBtn.addEventListener("click", () => {
      clearInterval(heartInterval);
      const elements = document.querySelectorAll(".heart");
      elements.forEach(el => el.remove()); 

      if (typeof confetti === "function") {
        confetti({ particleCount: 200, spread: 100, origin: { y: 0.65 } });
      }

      setTimeout(() => {
        homePage.classList.remove("active");
        yesPage.classList.add("active");
        textInterval = setInterval(createBackgroundText, 350);
      }, 400);
    });

    // لو تم الضغط على NO
    noBtn.addEventListener("click", () => {
      homePage.classList.remove("active");
      noPage.classList.add("active");
    });

    function backToQuestion() {
      noPage.classList.remove("active");
      homePage.classList.add("active");
    }

    // القلوب الطائرة بالخلفية
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = Math.random() > 0.5 ? "❤️" : "💗";
      heart.style.left = Math.random() * 95 + "vw";
      heart.style.fontSize = Math.random() * 16 + 14 + "px";
      
      const duration = Math.random() * 2 + 4;
      heart.style.animationDuration = duration + "s";
      heart.style.opacity = Math.random() * 0.4 + 0.4;
      
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), duration * 1000);
    }
    heartInterval = setInterval(createHeart, 500);

    const loveWords = [
      "بحبك 💞", "I love you ✨", "Je t'aime 🌸", "Te amo 💕", "Ti amo 🎀", 
      "Ich liebe dich 💫", "Seni seviyorum 💖", "愛してる 💗", "사랑해 🌸", 
      "Wo ai ni 💕", "Mahal kita ✨", "Eu te amo 💝", "Ik hou van jou 💫", 
      "Σ' αγاπώ 🎀", "Nakupenda 💞", "Volim te 🌸", "Szeretlek 💖", "Kocham cię 💕",
      "Я тебя люблю 👑", "Mən səni sevirəm ✨"
    ];

    function createBackgroundText() {
      const word = loveWords[Math.floor(Math.random() * loveWords.length)];
      const span = document.createElement("span");
      span.className = "bg-text";
      span.innerText = word;
      span.style.left = Math.random() * 80 + 'vw';
      span.style.fontSize = (Math.random() * 4 + 18) + 'px';
      
      const duration = Math.random() * 2 + 5;
      span.style.animationDuration = duration + 's';
      
      document.body.appendChild(span);
      setTimeout(() => span.remove(), duration * 1000);
    }
  </script>
</body>
</html>
